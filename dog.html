<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog - Dog Adoption</title>
    <link rel="stylesheet" href="./css/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #fdf6e3;
            margin: 0;
            color: #333;
            line-height: 1.8;
        }

        header {
            background-color: #fef3c7;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
        }

        header nav ul {
            list-style: none;
            padding: 0;
            display: flex;
            gap: 15px;
        }

        header nav ul li a {
            text-decoration: none;
            color: #f76c6c;
            font-weight: 500;
        }

        header nav ul li a:hover {
        color: #d83f3f;
        }

        footer {
            background-color: #fef3c7;
            padding: 10px;
            text-align: center;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
        }

        footer p {
            margin: 5px 0;
        }

        footer a {
            text-decoration: none;
            color: #f76c6c;
            margin-left: 10px;
            font-size: 1.2rem;
        }

        footer a:hover {
            color: #d83f3f;
        }

        .social-icons a {
            margin: 0 10px;
            color: #555;
            font-size: 1.5rem;
        }

        .social-icons a:hover {
            color: #f76c6c;
        }

        section {
            padding: 20px 0; 
        }

        #dog {
            margin-bottom: 20px; 
        }

        section h1, section h2, section p {
            margin: 0; 
            padding: 0;
        }
    </style>
</head>
<body>
    <header class="h-24 flex items-center">
        <div class="container mx-auto">
            <img src="logo.png" width="150px" class="p-3"/>
            <nav>
                <ul class="mt-3">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="adopt.html">Adopt</a></li>
                    <li><a href="process.html">Process</a></li>
                    <li><a href="about-us.html">About us</a></li>
                </ul>
            </nav>
            <div class="auth">
                <a href="dashboard.html" class="mr-2">Dashboard</a>
                <a href="dashboard.html?action=logout"><i class="fa-solid fa-right-from-bracket"></i></a>
            </div>
            <div class="guest">
                <a href="register.html" class="mr-2">Register</a>
                <a href="login.html">Login</a>
            </div>
        </div>
    </header>


    <section class="py-8 bg-amber-50">
        <div id="dog" class="container mx-auto flex justify-between items-start">
        </div>
    </section>

    <footer class="bg-amber-100">
        <div class="container mx-auto h-16 flex justify-between items-center" style="padding: 7px;">
            <p>&copy; 2024 Dog Adoption. All rights reserved.</p>
            <p>Contact us: <a href="mailto:info@dogadoption.com">info@dogadoption.com</a></p>
            <div>
                <a href="https://www.facebook.com" target="_blank"><i class="fab fa-facebook"></i></a>
                <a href="https://www.twitter.com" target="_blank"><i class="fab fa-twitter"></i></a>
                <a href="https://www.instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
            </div>
            
        </div>
    </footer>
    <script type="module">
        import {authLinks} from "./modules/App.js";
        
        const isloggedin = localStorage.getItem('isloggedin') ?? false;
        
        const adopt = JSON.parse(localStorage.getItem('adopt')) ?? [];
        
        const dog_div = document.querySelector('#dog');
        authLinks(isloggedin);
    
        const params = new URLSearchParams(window.location.search);
        const dog_id = params.get('id');
    
        function isDogAdopted(id) {
            return adopt.some(dog => dog.id === id);
        }

        fetch(`https://api.thedogapi.com/v1/images/${dog_id}?api_key=YOUR_API_KEY_HERE`)
            .then(resp => resp.json())
            .then(dog => {
                const breed = dog.breeds.length > 0 ? dog.breeds[0] : null;
    
                dog_div.innerHTML = `
                    <div style="display: flex; align-items: center; margin-left: 150px;">
                        <img src="${dog.url}" alt="Dog" class="h-64 object-cover rounded-md" style="margin-right: 24px;">
                        <div>
                            <h2 class="text-lg font-bold">Name: ${breed ? breed.name : 'Unknown Breed'}</h2>
                            <h6 class="text-sm font-semibold">ID: ${breed ? breed.id : 'Unknown Breed'}</h6>
                            <p>Description: ${breed ? breed.description : 'Description not available'}</p>
                            <p>Temperament: ${breed ? breed.temperament : 'Temperament not available'}</p>
                            
                            <p>Country code: ${breed ? breed.country_code : 'Country code not available'}</p>
                            <p>Hypoallergenic: ${breed ? breed.hypoallergenic : 'Hypoallergenic status not available'}</p>
                            <p>Life span: ${breed ? breed.life_span : 'Life span not available'}</p>
    
                            <div class="flex flex-col items-center">
                                <blockquote class="text-amber-800 mb-4" style="width:700px">
                                    "A dog is the only thing on earth that loves you more than he loves himself." — Josh Billings
                                </blockquote>
                                <img src="https://th.bing.com/th/id/R.98151a0cda6b6ecbcafd8325e3a398d0?rik=FyCBYEsMWnoCQw&riu=http%3a%2f%2fraceromanian.org%2fwp-content%2fuploads%2f2019%2f03%2fLOGO.png&ehk=EBZpZzZSTAeT3LLkk8iT0Xe4thgAcx%2bezcSOk6I4uHU%3d&risl=&pid=ImgRaw&r=0" class="w-[50px]">
                            </div>
    
                            ${(isloggedin) ? `
                                <div class="mt-12 flex items-center justify-start">
                                    <p class="text-amber-200 mb-4" style="margin-right: 16px;">Ready to give this dog a loving home?</p>
                                    <button id="adopt-btn" class="text-white p-2 rounded-md border border-amber-800" style="background-color: rgb(137, 98, 46); color:white;">Adopt</button>
                                </div>
                            ` : `<p class="mt-6">Please <a href= "login.html" style="text-decoration:underline">login</a> first.`}
                        </div>
                    </div>
                `;
    
                const adoptBtn = document.getElementById('adopt-btn');
                if (adoptBtn) {
                    adoptBtn.addEventListener('click', () => {
                        if (isDogAdopted(dog_id)) {
                            alert('This dog is already in the adoption process!');
                        } else {
                            adopt.push({ id: dog_id, name: breed ? breed.name : 'Unknown Breed' });
                            localStorage.setItem('adopt', JSON.stringify(adopt));
    
                            alert('This dog is now ready to start the adoption process.');
                            window.location.href = 'process.html';
                    
                        }
                    });
                }
            })
            .catch(error => console.error('Error fetching dog details:', error));
    </script>
</body>
</html>
