<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adopted Dogs</title>
    <link rel="stylesheet" href="./css/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body {
            margin: 0;
            overflow-x: hidden;
        }
        #dog-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding: 0 16px;
        }
        .dog-item {
            border: 1px solid #E2E8F0; 
            padding: 16px;
            border-radius: 8px;
            background-color: #FFFAF0;
            overflow: hidden;
        }
        body {
                font-family: 'Poppins', sans-serif;
                background-color: #fdf6e3;
                margin: 0;
                color: #333;
                line-height: 1.8;
            }
    
            header {
                background-color: #fef3c7;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            }
    
            header .container {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 10px 20px;
            }
    
            header nav ul {
                list-style: none;
                padding: 0;
                display: flex;
                gap: 15px;
            }
    
            header nav ul li a {
                text-decoration: none;
                color: #f76c6c;
                font-weight: 500;
            }
    
            header nav ul li a:hover {
                color: #d83f3f;
            }
    
            h1 {
                font-size: 2.5rem;
                color: #f76c6c;
                margin-bottom: 10px;
            }
    
            h3 {
                font-size: 1.8rem;
                color: #d83f3f;
                margin-top: 20px;
                margin-bottom: 10px;
            }
    
            p {
                font-size: 1rem;
                color: #555;
                margin-bottom: 20px;
            }
    
            footer {
                background-color: #fef3c7;
                padding: 10px;
                text-align: center;
                box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
            }
    
            footer p {
                margin: 5px 0;
            }
    
            footer a {
                text-decoration: none;
                color: #f76c6c;
                margin-left: 10px;
                font-size: 1.2rem;
            }
    
            footer a:hover {
                color: #d83f3f;
            }
    
            .social-icons a {
                margin: 0 10px;
                color: #555;
                font-size: 1.5rem;
            }
    
            .social-icons a:hover {
                color: #f76c6c;
            }
    </style>
</head>
<body>
    <header class="h-24 flex items-center">
        <div class="container mx-auto">
            <img src="logo.png" width="150px" class="p-3"/>
            <nav>
                <ul class="mt-3">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="adopt.html">Adopt</a></li>
                    <li><a href="process.html">Process</a></li>
                    <li><a href="about-us.html">About us</a></li>
                </ul>
            </nav>
            <div class="auth">
                <a href="dashboard.html" class="mr-2">Dashboard</a>
                <a href="dashboard.html?action=logout"><i class="fa-solid fa-right-from-bracket"></i></a>
            </div>
            <div class="guest">
                <a href="register.html" class="mr-2">Register</a>
                <a href="login.html">Login</a>
            </div>
        </div>
    </header>

    <section class="py-8 bg-amber-50">
        <div id="adopted-dogs" class="container mx-auto">
            <h2 class="text-2xl font-semibold text-amber-800" style="margin-bottom: 8px; margin-left: 15px;">𝖣𝗈𝗀𝗌 𝖼𝗁𝗈𝗌𝖾𝗇 𝗍𝗈 𝖺𝖽𝗈𝗉𝗍 :</h2>
            <div id="dog-list"></div>
            <form id="checkout" method="POST" style="margin-top: 15px; margin-left: 15px;">
            
                <textarea name="address" placeholder="Enter your delivery address" class="border border-amber-500 px-6 py-2 block" style="padding-left: 4px;width: 400px;"></textarea>
                <button style="color: white; background-color: brown; margin-top: 8px; padding: 5px;" class="rounded-md">Checkout</button>
            </form>
        </div>
    </section>

    <footer class="bg-amber-100">
        <div class="container mx-auto h-16 flex justify-between items-center" style="padding: 7px;">
            <p>&copy; 2024 Dog Adoption. All rights reserved.</p>
            <p>Contact us: <a href="mailto:info@dogadoption.com">info@dogadoption.com</a></p>
            <div>
                <a href="https://www.facebook.com" target="_blank"><i class="fab fa-facebook"></i></a>
                <a href="https://www.twitter.com" target="_blank"><i class="fab fa-twitter"></i></a>
                <a href="https://www.instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
            </div>
        </div>
    </footer>

    <script type="module">
        import { authLinks } from "./modules/App.js";
        const isloggedin = localStorage.getItem('isloggedin') ?? false;
    

        let adoptedDogs = JSON.parse(localStorage.getItem('adopt')) ?? [];
        const dogListDiv = document.getElementById('dog-list');
    
        authLinks(isloggedin);
    
        if(!isloggedin ){
            document.querySelector('#checkout').style.display='none';
        }
    
        function renderDogs() {
            dogListDiv.innerHTML = ''; 
            if (adoptedDogs.length === 0) {
                dogListDiv.innerHTML = `<p>No dogs in the process of adoption yet.</p>`;
            } else {
                adoptedDogs.forEach((dog, index) => {
                    dogListDiv.innerHTML += `
                        <div class="dog-item" style="background-color:#fff5d8">
                            <h3 class="font-bold">Breed: ${dog.name}</h3>
                            <p>ID: ${dog.id}</p>
                            <button onclick="deleteDog(${index})" class="rounded-md border border-amber-800" style="color:red; background-color:white; font-family:bold; padding:3px; margin-top:10px;">Delete</button>
                        </div>
                    `;
                });
            }
            updateCheckoutFormVisibility(); 
        }
    
        window.deleteDog = function(index) {
            adoptedDogs.splice(index, 1); 
            localStorage.setItem('adopt', JSON.stringify(adoptedDogs));
            renderDogs();
        }
    
        function updateCheckoutFormVisibility() {
            const checkoutForm = document.querySelector('#checkout');
            if (adoptedDogs.length === 0) {
                checkoutForm.style.display = 'none';
            } else {
                checkoutForm.style.display = 'block'; 
            }
        }
    
        renderDogs();
    
        document.querySelector('#checkout').addEventListener('submit', e => {
            e.preventDefault();
    
            const address = e.target.elements['address'].value;
            const user = localStorage.getItem('user'); 
    
            if (user != null) {
                const orders = JSON.parse(localStorage.getItem('orders')) || []; 
                const order = {
                    user: user,
                    address,
                    items: adoptedDogs 
                };
    
                orders.push(order); 
                localStorage.setItem('orders', JSON.stringify(orders)); 
    
                localStorage.removeItem('adopt');
                adoptedDogs = []; 
                renderDogs(); 
                e.target.reset(); 
    
                alert('Congratulations on adopting your furry friend! We hope to see you back here soon!');
                window.location.href = 'dashboard.html';
            } else {
                alert('Please login first!');
            }
        });
    
        
        updateCheckoutFormVisibility(); 
    
    </script>
