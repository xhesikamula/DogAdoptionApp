<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Dog Adoption</title>
    <link rel="stylesheet" href="./css/output.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
        <style>
            body {
                font-family: 'Poppins', sans-serif;
                background-color: #fdf6e3;
                margin: 0;
                color: #333;
                line-height: 1.8;
            }
    
            header {
                background-color: #fef3c7;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            }
    
            header .container {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 10px 20px;
            }
    
            header nav ul {
                list-style: none;
                padding: 0;
                display: flex;
                gap: 15px;
            }
    
            header nav ul li a {
                text-decoration: none;
                color: #f76c6c;
                font-weight: 500;
            }
    
            header nav ul li a:hover {
                color: #d83f3f;
            }
    
            h1 {
                font-size: 2.5rem;
                color: #f76c6c;
                margin-bottom: 10px;
            }
    
            h3 {
                font-size: 1.8rem;
                color: #d83f3f;
                margin-top: 20px;
                margin-bottom: 10px;
            }
    
            p {
                font-size: 1rem;
                color: #555;
                margin-bottom: 20px;
            }
    
            footer {
                background-color: #fef3c7;
                padding: 10px;
                text-align: center;
                box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
            }
    
            footer p {
                margin: 5px 0;
            }
    
            footer a {
                text-decoration: none;
                color: #f76c6c;
                margin-left: 10px;
                font-size: 1.2rem;
            }
    
            footer a:hover {
                color: #d83f3f;
            }
    
            .social-icons a {
                margin: 0 10px;
                color: #555;
                font-size: 1.5rem;
            }
    
            .social-icons a:hover {
                color: #f76c6c;
            }
    
        </style>
</head>

<body>
    <header class="h-24 flex items-center">
        <div class="container mx-auto">
            <img src="logo.png" width="150px" class="p-3"/>
            <nav>
                <ul class="mt-3">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="adopt.html">Adopt</a></li>
                    <li><a href="process.html">Process</a></li>
                    <li><a href="about-us.html">About us</a></li>
                </ul>
            </nav>
            <div class="auth">
                <a href="dashboard.html" class="mr-2">Dashboard</a>
                <a href="#" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i></a>
            </div>
            <div class="guest">
                <a href="register.html" class="mr-2">Register</a>
                <a href="login.html">Login</a>
            </div>
        </div>
    </header>


    <section class="py-8 bg-amber-50">
        <div class="container mx-auto">
                <h2 class="text-3xl mb-6 text-amber-800 font-semibold text-center">𝐃𝐚𝐬𝐡𝐛𝐨𝐚𝐫𝐝</h2>
                <p class="mx-auto text-center mt-2 text-amber-200">The adoption process is completely <b>free!</b></p>
                <div id="orders" class="mt-12"></div>
        </div>
    </section>

    <footer class="bg-amber-100 mt-8">
        <div class="container mx-auto h-16 flex justify-between items-center" style="padding: 7px;">
            <p>&copy; 2024 Dog Adoption. All rights reserved.</p>
            <p>Contact us: <a href="mailto:info@dogadoption.com">info@dogadoption.com</a></p>
            <div>
                <a href="https://www.facebook.com" target="_blank"><i class="fab fa-facebook"></i></a>
                <a href="https://www.twitter.com" target="_blank"><i class="fab fa-twitter"></i></a>
                <a href="https://www.instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
            </div>
        </div>
    </footer>

    <script type="module">
        import {authLinks, renderOrders} from "./modules/App.js"

        const isloggedin = localStorage.getItem('isloggedin') === 'true';
let orders = localStorage.getItem('orders') ?? [];

if (!isloggedin) {
    window.location.href = 'index.html';
}

authLinks(isloggedin);

document.getElementById('logoutBtn')?.addEventListener('click', (e) => {
    e.preventDefault();
    localStorage.removeItem('isloggedin');
    window.location.href = 'index.html';
});


// Render orders only if they exist
document.querySelector('#orders').innerHTML = renderOrders(orders);

    </script>
</body>
</html>
