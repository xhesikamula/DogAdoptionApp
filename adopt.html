<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adopt - Dog Adoption</title>
    <link rel="stylesheet" href="./css/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #fdf6e3;
            margin: 0;
            color: #333;
            line-height: 1.8;
        }

        header {
            background-color: #fef3c7;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
        }

        header nav ul {
            list-style: none;
            padding: 0;
            display: flex;
            gap: 15px;
        }

        header nav ul li a {
            text-decoration: none;
            color: #f76c6c;
            font-weight: 500;
        }

        header nav ul li a:hover {
            color: #d83f3f;
        }

        h1 {
            font-size: 2.5rem;
            color: #f76c6c;
            margin-bottom: 10px;
        }

        h3 {
            font-size: 1.8rem;
            color: #d83f3f;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        p {
            font-size: 1rem;
            color: #555;
            margin-bottom: 20px;
        }

        footer {
            background-color: #fef3c7;
            padding: 10px;
            text-align: center;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
        }

        footer p {
            margin: 5px 0;
        }

        footer a {
            text-decoration: none;
            color: #f76c6c;
            margin-left: 10px;
            font-size: 1.2rem;
        }

        footer a:hover {
            color: #d83f3f;
        }

        .social-icons a {
            margin: 0 10px;
            color: #555;
            font-size: 1.5rem;
        }

        .social-icons a:hover {
            color: #f76c6c;
        }

        
    </style>
</head>
<body>
    <header class="h-24 flex items-center">
        <div class="container mx-auto">
            <img src="logo.png" width="150px" class="p-3"/>
            <nav>
                <ul class="mt-3">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="adopt.html">Adopt</a></li>
                    <li><a href="process.html">Process</a></li>
                    <li><a href="about-us.html">About us</a></li>
                </ul>
            </nav>
            <div class="auth">
                <a href="dashboard.html" class="mr-2">Dashboard</a>
                <a href="dashboard.html?action=logout"><i class="fa-solid fa-right-from-bracket"></i></a>
            </div>
            <div class="guest">
                <a href="register.html" class="mr-2">Register</a>
                <a href="login.html">Login</a>
            </div>
        </div>
    </header>


    <section class="py-8 bg-amber-50">
        <div class="container mx-auto">
            <div class="flex justify-between items-center p-4">
                <div class="w-[500px]">
                <input type="search" placeholder="Search by dog breed" class=" border-amber-300 p-2 mr-3" style="width: 350px;"/>
                <a href="adopt.html" style="text-decoration:underline">Clear</a>
                </div>
                <div class="flex justify-center items-center gap-2">
                    <button class=" p-2 border " id="prev-btn" style="background-color: #C19552; color: white;">
                        Prev
                    </button>
                    <p class="mx-4 mt-4" id="page"></p>
                    <button class=" p-2 border" id="next-btn" style="background-color: #C19552; color: white;">
                        Next
                    </button>
                </div>
            </div>
            <div id="dogs" class="grid grid-cols-4 gap-4 mt-4">
            </div>
        </div>
    </section>
    
    <footer class="bg-amber-100">
        <div class="container mx-auto h-12 flex justify-between items-center" style="padding: 7px;">
            <p>&copy; 2024 Dog Adoption. All rights reserved.</p>
            <p>Contact us: <a href="mailto:info@dogadoption.com">info@dogadoption.com</a></p>
            <div>
                <a href="https://www.facebook.com" target="_blank"><i class="fab fa-facebook"></i></a>
                <a href="https://www.twitter.com" target="_blank"><i class="fab fa-twitter"></i></a>
                <a href="https://www.instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
            </div>
        </div>
    </footer>

    <script type="module">
        import { authLinks } from "./modules/App.js";
        const isloggedin = localStorage.getItem('isloggedin') ?? false;
    
        let currentPage = 0;  
        const dogsPerPage = 8; 
        let dogList = [];    
        const dogs_div = document.querySelector('#dogs');
        const prev_btn = document.querySelector('#prev-btn');
        const next_btn = document.querySelector('#next-btn');
        const page_div = document.querySelector('#page');
        const search = document.querySelector('input[type="search"]');
    
        authLinks(isloggedin);
        fetchDogs();
    
        async function fetchDogs() {
            try {
                const response = await fetch('https://api.thedogapi.com/v1/images/search?limit=30&has_breeds=1&api_key=live_wLKK0cQ7viWzknWXQ4ZEUbUdUlHt83zG6vfGi9hbrAaPITDDHM0GR3G3OWE9d8pr');
                dogList = await response.json(); // me i rujt fetched dogs
                currentPage = 0; 
                displayDogs();
            } catch (error) {
                console.error('Error fetching dog images:', error);
            }
        }
    
        function displayDogs() {
            const startIndex = currentPage * dogsPerPage; //kalkulon start index-in
            const endIndex = startIndex + dogsPerPage; // kalkulon end index-in
            const dogsToDisplay = dogList.slice(startIndex, endIndex); 
    
            dogs_div.innerHTML = ''; // Clear
    
            dogsToDisplay.forEach(dog => {
                const breed = dog.breeds && dog.breeds.length > 0 ? dog.breeds[0] : null;
    
                dogs_div.innerHTML += `
                    <div class="border border-amber-200 rounded-md p-4">
                        <div>
                            <img src="${dog.url}" alt="Dog" class="w-full h-64 object-cover rounded-md">
                        </div>
                        <div class="flex items-center justify-between">
                            <div>
                                <div class="flex items-center justify-between">
                                <h4 class="text-md font-semibold">${breed ? breed.name : 'Unknown Breed'}</h4>
                                <a href="adopt.html" class="w-[50px] block mx-auto text-center py-2 text-amber-600 hover:text-amber-800 font-semibold"><i class="fa-solid fa-heart"></i></a>
                                </div>
                                <p>${breed ? breed.country_code : 'Country code not available'}</p>
                                <p>${breed ? `Life Span: ${breed.life_span}` : 'Life span not available'}</p>
                            </div>
                            <a href="dog.html?id=${dog.id}" class="w-[50px] text-center p-1 text-amber-200 border border-amber-300 
                            hover:text-amber-800 hover:bg-amber-100
                            font-semibold"><i class="fa-solid fa-arrow-right"></i></a>
                        </div>
                    </div>
                `;
            });
    
            page_div.innerHTML = `Page ${currentPage + 1} of ${Math.ceil(dogList.length / dogsPerPage)}`; // Update page display
        }
    
    
        prev_btn.addEventListener('click', () => {
            if (currentPage > 0) {
                currentPage--; 
                displayDogs();
            }
        });
    
        
        next_btn.addEventListener('click', () => {
            if ((currentPage + 1) * dogsPerPage < dogList.length) {
                currentPage++; 
                displayDogs(); 
            }
        });
    
        search.addEventListener('keyup', () => {
            const searchValue = search.value.toLowerCase(); 
            const filteredDogs = dogList.filter(dog => {
                const breed = dog.breeds && dog.breeds.length > 0 ? dog.breeds[0].name.toLowerCase() : '';
                return breed.includes(searchValue); //kontrollon nese breed name po e perfshin inputin e search
            });
    
            currentPage = 0; 
            dogList = filteredDogs; //update me u bo lista dog me rezultatet e filtrume
            displayDogs(); 
        });
    </script>
</body>
</html>
